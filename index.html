<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="message">Happy Birthday!</div>
  <div class="cake">
    <div class="layer top">
      <div class="icing"></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="sprinkle red" style="top:15px; left:20px;"></div>
      <div class="sprinkle blue" style="top:18px; left:50px;"></div>
      <div class="sprinkle yellow" style="top:12px; left:80px;"></div>
    </div>

    <div class="layer middle">
      <div class="icing"></div>
      <div class="sprinkle pink" style="top:15px; left:40px;"></div>
      <div class="sprinkle green" style="top:18px; left:70px;"></div>
      <div class="sprinkle red" style="top:20px; left:120px;"></div>
    </div>

    <div class="layer bottom">
      <div class="icing"></div>
      <div class="sprinkle blue" style="top:20px; left:60px;"></div>
      <div class="sprinkle yellow" style="top:22px; left:100px;"></div>
      <div class="sprinkle pink" style="top:18px; left:160px;"></div>
    </div>
  </div>
</body>
</html>
